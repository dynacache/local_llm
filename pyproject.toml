[project]
name = "local-llm"
version = "0.1.0"
description = "Run open-weight LLMs locally: llama.cpp engine, OpenAI-compatible API server, and CLI chat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "llama-cpp-python[server]>=0.3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "huggingface-hub>=0.24",
]

[project.scripts]
local-llm = "local_llm.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "gguf>=0.10",
    "numpy>=1.26",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
